<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Date Invitation ♡</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
      background:linear-gradient(160deg,#fff4f8 0%,#ffdce8 45%,#f8c9da 100%);
      color:#5b3341;padding:20px;
    }
    .card{
      width:min(92vw,430px);background:rgba(255,255,255,.82);backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:28px 24px;
      box-shadow:0 20px 60px rgba(157,70,104,.18);text-align:center;position:relative;overflow:hidden;
    }
    .sparkle{position:absolute;font-size:22px;opacity:.7;animation:float 3s ease-in-out infinite}
    .s1{top:18px;left:20px}.s2{top:28px;right:24px;animation-delay:.8s}.s3{bottom:22px;left:32px;animation-delay:1.4s}
    @keyframes float{50%{transform:translateY(-7px) rotate(8deg)}}
    h1{font-size:28px;margin:8px 0 10px;line-height:1.25}
    h2{font-size:23px;margin:6px 0 10px}
    p{line-height:1.7;margin:8px 0 18px;color:#7a5360}
    .big{font-size:68px;margin:6px 0 8px}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative;min-height:54px}
    button,.option{
      border:0;border-radius:999px;padding:14px 22px;font-size:16px;font-weight:700;cursor:pointer;
      transition:.2s ease;box-shadow:0 8px 20px rgba(154,69,104,.13)
    }
    button:hover,.option:hover{transform:translateY(-2px)}
    .primary{background:#df6f97;color:white}.secondary{background:white;color:#9a5570;border:1px solid #efbfd1}
    #noBtn{position:relative}
    .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
    .option{background:#fff;color:#724657;border:1px solid #f0bfd1;padding:14px 10px}
    .option.selected{background:#e97fa6;color:#fff;border-color:#e97fa6}
    label{display:block;text-align:left;font-size:14px;margin:13px 0 6px;color:#7a5360}
    input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid #e8bfd0;background:#fff;font-size:16px;color:#5b3341}
    .hidden{display:none}
    .summary{background:#fff7fa;border-radius:18px;padding:16px;text-align:left;margin:16px 0;line-height:1.8}
    .tiny{font-size:12px;opacity:.7;margin-top:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="sparkle s1">✦</div><div class="sparkle s2">♡</div><div class="sparkle s3">✧</div>

    <section id="step1">
      <div class="big">🎂</div>
      <h1>壽星本人，請問一下 ♡</h1>
      <p>你願意接受女朋友精心安排的<br>生日約會邀請嗎？</p>
      <div class="btns" id="firstBtns">
        <button class="primary" onclick="goStep(2)">YES ♡</button>
        <button class="secondary" id="noBtn">NO</button>
      </div>
      <div class="tiny">※ NO 好像不是很想被按到。</div>
    </section>

    <section id="step2" class="hidden">
      <div class="big">🍽️</div>
      <h2>那要去哪裡吃飯？</h2>
      <p>請壽星慎重選擇（女朋友保留最終解釋權）</p>
      <div class="options" id="restaurantOptions">
        <div class="option" data-value="八八口" onclick="selectOption(this)">🥩 八八口</div>
        <div class="option" data-value="古拉爵" onclick="selectOption(this)">🍝 古拉爵</div>
        <div class="option" data-value="momo 壽喜燒" onclick="selectOption(this)">🍲 momo 壽喜燒</div>
        <div class="option" data-value="交給女朋友決定" onclick="selectOption(this)">🎀 交給女朋友</div>
      </div>
      <button class="primary" onclick="nextRestaurant()">選好了 ♡</button>
    </section>

    <section id="step3" class="hidden">
      <div class="big">📅</div>
      <h2>預約生日約會</h2>
      <p>再選一下日期跟時間，我們就正式成立 ♡</p>
      <label for="date">日期</label>
      <input type="date" id="date" />
      <label for="time">時間</label>
      <input type="time" id="time" value="18:00" />
      <div style="height:16px"></div>
      <button class="primary" onclick="finish()">確認約會 ♡</button>
    </section>

    <section id="step4" class="hidden">
      <div class="big">💌</div>
      <h1>約會預約成功！</h1>
      <p>恭喜壽星獲得一份<br>女朋友限定生日約會 ♡</p>
      <div class="summary" id="summary"></div>
      <p>請準時、穿好看一點，<br>然後開開心心跟我去約會。</p>
      <button class="secondary" onclick="restart()">再看一次</button>
    </section>
  </main>

  <script>
    let restaurant='';
    const noBtn=document.getElementById('noBtn');
    function escapeNo(){
      const card=document.querySelector('.card');
      const r=card.getBoundingClientRect();
      const maxX=Math.max(10,r.width-noBtn.offsetWidth-40);
      const maxY=110;
      noBtn.style.position='absolute';
      noBtn.style.left=Math.random()*maxX+'px';
      noBtn.style.top=Math.random()*maxY+'px';
    }
    ['mouseenter','touchstart','click'].forEach(ev=>noBtn.addEventListener(ev,(e)=>{e.preventDefault();escapeNo()}));

    function goStep(n){
      document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));
      document.getElementById('step'+n).classList.remove('hidden');
    }
    function selectOption(el){
      document.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));
      el.classList.add('selected');restaurant=el.dataset.value;
    }
    function nextRestaurant(){
      if(!restaurant){alert('要先選一個啦 ♡');return;}
      goStep(3);
    }
    function finish(){
      const date=document.getElementById('date').value;
      const time=document.getElementById('time').value;
      if(!date){alert('日期還沒選喔 ♡');return;}
      document.getElementById('summary').innerHTML=`<b>餐廳：</b>${restaurant}<br><b>日期：</b>${date}<br><b>時間：</b>${time || '待定'}`;
      goStep(4);
    }
    function restart(){restaurant='';document.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));goStep(1)}
  </script>
</body>
</html>
